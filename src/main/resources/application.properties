server.port=8081
spring.application.name=listas-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sigle_listas?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=sigle_user
spring.datasource.password=sigle_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.listasService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.listasService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.listasService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.listasService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.listasService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.listasService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.listasService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j Retry
resilience4j.retry.instances.listasService.maxAttempts=3
resilience4j.retry.instances.listasService.waitDuration=500ms

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always